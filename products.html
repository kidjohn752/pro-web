<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Ethio-commerce</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // Restrict access unless properly logged in
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            alert('Please login to view our products.');
            window.location.href = 'login.html';
        }
    </script>
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">🛍️ Ethio-commerce</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html" class="active">Products</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html" class="auth-link">Login</a></li>
                <li>
                    <div class="cart-icon" onclick="toggleCart()">
                        🛒<span class="cart-count" id="cartCount">0</span>
                    </div>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <h2 class="section-title">All Products</h2>
            <p class="section-subtitle">Browse our massive collection of premium items</p>

            <div class="categories">
                <button class="category-btn active" onclick="filterData('all', this)">All</button>
                <button class="category-btn" onclick="filterData('electronics', this)">Electronics</button>
                <button class="category-btn" onclick="filterData('fashion', this)">Fashion</button>
                <button class="category-btn" onclick="filterData('home', this)">Home & Living</button>
                <button class="category-btn" onclick="filterData('sports', this)">Sports</button>
            </div>

            <div class="products-grid" id="fullProductGrid"></div>
        </div>
    </main>

    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2>Shopping Cart</h2>
            <button class="close-cart" onclick="toggleCart()">✕</button>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer" id="cartFooter">
            <div class="cart-total"><span>Total:</span><span id="cartTotal">$0.00</span></div>
            <button class="btn btn-primary" style="width: 100%;" onclick="checkoutCart()">Checkout</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Ethio-commerce. All rights reserved.</p>
    </footer>

    <script src="product.js"></script>
    <script src="cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderProductGrid('fullProductGrid', 'all');
        });

        function filterData(category, btn) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProductGrid('fullProductGrid', category);
        }
    </script>
</body>
</html>
