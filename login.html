<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ethio-commerce</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">🛍️ Ethio-commerce</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html" class="auth-link active">Login</a></li>
                <li><div class="cart-icon" onclick="toggleCart()">🛒<span class="cart-count" id="cartCount">0</span></div></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <div class="form-wrapper">
                <div style="text-align: center; margin-bottom: 2rem;">
                    <h2 style="font-size: 2rem;">Welcome Back</h2>
                    <p style="color: #666;">Sign in to your account</p>
                </div>
                <form onsubmit="event.preventDefault(); localStorage.setItem('isLoggedIn', 'true'); window.location.href='products.html';">
                    <div class="form-group"><label>Email</label><input type="email" required></div>
                    <div class="form-group"><label>Password</label><input type="password" maxlength="8" placeholder="Max 8 characters" required></div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
                    <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">Don't have an account? <a href="#" style="color: #6366f1;">Create one</a></p>
                </form>
            </div>
        </div>
    </main>

    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header"><h2>Shopping Cart</h2><button class="close-cart" onclick="toggleCart()">✕</button></div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer" id="cartFooter"><div class="cart-total"><span>Total:</span><span id="cartTotal">$0.00</span></div><button class="btn btn-primary" style="width: 100%;" onclick="checkoutCart()">Checkout</button></div>
    </div>

    <footer><p>&copy; 2026 Ethio-commerce. All rights reserved.</p></footer>
    <script src="product.js"></script>
    <script src="cart.js"></script>
</body>
</html>
